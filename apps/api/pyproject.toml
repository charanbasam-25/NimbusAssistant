[project]
name = "nimbus-api"
version = "0.1.0"
description = "Nimbus Support Assistant API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26",
  "fastapi[standard]>=0.115,<1.0",
  "pgvector>=0.3,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt[crypto]>=2.8,<3",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.17.6,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
